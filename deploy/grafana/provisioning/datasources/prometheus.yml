# Auto-provisions the Prometheus datasource on Grafana startup.
# Docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # "prometheus" is the service name of the Prometheus container defined in
    # deploy/compose.observability.yml — Grafana reaches it over the compose
    # network, not through a published host port.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
