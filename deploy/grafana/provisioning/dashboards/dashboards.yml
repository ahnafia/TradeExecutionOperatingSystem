# Auto-loads dashboard JSON files from disk on Grafana startup.
# Docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards

apiVersion: 1

providers:
  - name: trading-system
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Mounted from deploy/grafana/dashboards in compose.observability.yml.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
