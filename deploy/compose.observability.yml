# Observability stack fragment — NOT wired into the root docker-compose.yml.
#
# This is deliberately a standalone file so it doesn't collide with concurrent
# edits to docker-compose.yml. To use it, either:
#
#   docker compose -f docker-compose.yml -f deploy/compose.observability.yml up
#
# or merge the two `services:` blocks by hand once docker-compose.yml settles.
#
# Grafana listens on 3001 (3000 assumed taken). Both services are demo-only:
# Grafana has anonymous admin access enabled, and neither has auth hardening,
# TLS, or persistent-volume backup. Do not point this at anything but a local
# `tradectl serve` instance.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: trading-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    # The engine runs on the host (`tradectl serve`), not in this compose
    # project, so Prometheus needs a route to the host's loopback interface.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: trading-grafana
    depends_on:
      - prometheus
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Local chaos-demo convenience: anyone hitting Grafana is already an
      # admin, no login screen. Do not reuse this fragment outside a local
      # demo environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 3000 may already be taken by another local project.
      - "3001:3000"
